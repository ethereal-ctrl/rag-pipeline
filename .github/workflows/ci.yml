name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyright
      - run: uv run pytest

  retrieval-gate:
    name: Retrieval gate (Smoke Set, no LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Cache the pinned dataset and the embedding model
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            ~/.cache/huggingface
          key: gate-${{ hashFiles('src/rag_pipeline/corpus.py', 'configs/gate/*.yaml') }}
      - name: Fetch the pinned MultiHop-RAG files (checksum-verified)
        run: uv run rag data fetch
      - name: Wait for Qdrant
        run: timeout 60 bash -c 'until curl -sf http://localhost:6333/readyz; do sleep 1; done'
      - name: Build the index and check retrieval metrics against the committed thresholds
        run: uv run rag gate
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
