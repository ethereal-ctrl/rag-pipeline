[project]
name = "rag-pipeline"
version = "0.1.0"
description = "A measured RAG Ablation Ladder on MultiHop-RAG, running fully locally."
authors = [{ name = "Safak Top" }]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "opentelemetry-api>=1.39.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "qdrant-client>=1.15",
    "scikit-learn==1.9.1",
    "sentence-transformers>=5.0",
    "torch>=2.9",
    "typer>=0.15",
]

[project.scripts]
rag = "rag_pipeline.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-pyyaml>=6.0",
]

# CPU-only PyTorch on Linux keeps the CI runner free of the multi-GB CUDA wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs running Qdrant/Ollama; excluded by default"]
addopts = "-m 'not integration'"
