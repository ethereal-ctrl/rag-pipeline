name: agentic-groq
index:
  collection: chunks-sent-w200-o1-ctx-qwen3.5-4b-qwen3-embedding-0.6b
  chunk_context: qwen3.5:4b
  embedder:
    provider: ollama
    model: qwen3-embedding:0.6b
    query_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "
retrieval:
  mode: hybrid
  top_k: 10
  candidates: 50
  rerank:
    reranker:
      provider: sentence-transformers
      model: BAAI/bge-reranker-v2-m3
    candidates: 30
generation:
  generator:
    provider: groq
    model: openai/gpt-oss-120b
    reasoning_effort: low
    max_output_tokens: 512
  context_chunks: 5
  citations:
    enabled: true
    support_check: llm
agentic:
  max_steps: 3
  max_tokens: 16000
  max_context_chunks: 6
  chunks_per_step: 2
