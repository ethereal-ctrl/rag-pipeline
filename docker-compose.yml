services:
  qdrant:
    image: qdrant/qdrant:v1.20.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/6333
          printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 15

  phoenix:
    image: arizephoenix/phoenix:version-12.0.0
    ports:
      - "127.0.0.1:6006:6006"
      - "127.0.0.1:4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:6006/readyz', timeout=2).close()
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      QDRANT_URL: http://qdrant:6333
      RAG_TRACING_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_URL: ${PHOENIX_URL:-http://localhost:6006}
      RAG_DEMO_VARIANT: ${RAG_DEMO_VARIANT:-hybrid-rerank-cited}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - huggingface_cache:/home/rag/.cache/huggingface
      - api_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      phoenix:
        condition: service_healthy

volumes:
  qdrant_data:
  phoenix_data:
  huggingface_cache:
  api_data:
